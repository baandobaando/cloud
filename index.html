<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font loads without holding up the first paint; text shows in the system font until it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" /></noscript>
    <script>document.documentElement.classList.add('js')</script>
    <style>
      /* Shown until the app's own script and styles take over: a dark page with the logo, never a flash of plain text. */
      html { background: #0a0a0b; }
      body { margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(40% 40% at 50% 50%, rgba(255, 36, 67, 0.18), transparent 70%), #0a0a0b; }
      .boot svg { width: 72px; height: 72px; animation: boot-pulse 1.2s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.9); opacity: 0.7; } }
      .js .prerender { display: none; }
      html:not(.js) .boot { display: none; }
    </style>
    <title>BingeTube · Short drama series you can't stop watching</title>
    <meta name="description" content="Binge-worthy vertical drama series — billionaires, revenge, werewolves and mafia. Start free, then $9.99/month for every episode." />
    <meta property="og:site_name" content="BingeTube" />
    <meta property="og:title" content="BingeTube" />
    <meta property="og:description" content="Binge-worthy vertical drama series. First episodes free." />
    <meta property="og:image" content="https://binge.tube/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-title" content="BingeTube" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading BingeTube"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="bm" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M47 49 L47 75 L68 62 Z" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/></mask></defs><g transform="translate(50 50) scale(.92) translate(-53.2 -53.2)"><g transform="translate(6.4 6.4)" fill="#ffb23d" mask="url(#bm)"><rect x="16" y="8" width="18" height="84" rx="9"/><circle cx="54" cy="62" r="30"/></g><g transform="translate(3.2 3.2)" fill="#ff6a35" mask="url(#bm)"><rect x="16" y="8" width="18" height="84" rx="9"/><circle cx="54" cy="62" r="30"/></g><g fill="#ff2443" mask="url(#bm)"><rect x="16" y="8" width="18" height="84" rx="9"/><circle cx="54" cy="62" r="30"/></g></g></svg></div><!--prerender--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
