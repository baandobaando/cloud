# One-click deploy: https://render.com/deploy?repo=https://github.com/baandobaando/cloud
services:
  - type: web
    name: reelflix
    runtime: node
    # A persistent disk (for the database and uploaded videos) needs a paid instance.
    plan: starter
    branch: claude/hello-kyvxbu
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --no-warnings server/index.ts
    healthCheckPath: /api/health
    # Every push to this branch redeploys the site automatically.
    autoDeploy: true
    disk:
      name: reelflix-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: DATA_DIR
        value: /var/data
      # You'll be asked for these when you click deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Bunny Stream (videos)
      - key: BUNNY_LIBRARY_ID
        value: "769632"
      - key: BUNNY_CDN_HOST
        value: vz-6d32ecb2-8a0.b-cdn.net
      - key: BUNNY_LIBRARY_KEY
        sync: false
      - key: BUNNY_TOKEN_KEY
        sync: false
      # Sync shows from Bunny every 5 minutes and keep only each video's top resolution.
      - key: BUNNY_AUTO_IMPORT
        value: "on"
      - key: BUNNY_SYNC_MINUTES
        value: "5"
      - key: BUNNY_KEEP_HIGHEST_ONLY
        value: "on"
      # Payment keys — optional at first; add them later under Environment.
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: BTCPAY_URL
        sync: false
      - key: BTCPAY_API_KEY
        sync: false
      - key: BTCPAY_STORE_ID
        sync: false
      - key: BTCPAY_WEBHOOK_SECRET
        sync: false
